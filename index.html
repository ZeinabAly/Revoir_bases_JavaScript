<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stockroom - Produits</title>

<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          display: ['"Space Grotesk"', 'sans-serif'],
          sans: ['Inter', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'monospace'],
        },
      },
    },
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!--
  @apply directement ici, dans une balise type="text/tailwindcss".
  Le CDN "Play" de Tailwind scanne le DOM et compile ce bloc en JIT :
  c'est la seule façon d'utiliser @apply sans passer par la CLI/PostCSS.
-->
<style type="text/tailwindcss">
  html{
      scroll-behavior: smooth;
  }
  body{
    overflow-x: hidden;
  }

  @layer components {
    .btn-primary {
      @apply inline-flex items-center justify-center gap-2 rounded-lg bg-amber-500 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-amber-400;
    }
    .input {
      @apply w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-700 placeholder:text-slate-400 focus:border-amber-500 focus:outline-none focus:ring-1 focus:ring-amber-500;
    }
    .label {
      @apply mb-1 block text-xs font-medium uppercase tracking-wide text-slate-500;
    }
    .card {
      @apply relative flex flex-col overflow-hidden rounded-xl border border-slate-200 bg-white transition-shadow hover:shadow-lg hover:shadow-amber-500/10;
    }
    .badge {
      @apply inline-flex items-center rounded-full px-2 py-0.5 font-mono text-[11px] font-medium;
    }
    .badge-stock {
      @apply badge bg-teal-500/10 text-teal-700;
    }
    .badge-outofstock {
      @apply badge bg-rose-500/10 text-rose-700;
    }
    .filter-group {
      @apply mb-4 border-b border-slate-200 pb-4;
    }
    .checkbox-row {
      @apply flex cursor-pointer select-none items-center gap-2 py-1 text-sm text-slate-600;
    }
 
    .modal {
        @apply fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 p-4 backdrop-blur-sm 
            opacity-100 transition-opacity duration-300 ease-out;
    }

    .modal.showModal {
        @apply pointer-events-none opacity-0;
    }

    .modal-panel {
        @apply w-full max-w-lg rounded-2xl border border-slate-200 bg-white p-6 shadow-2xl 
            scale-100 transition-transform duration-300 ease-out;
    }

    .modal.showModal .modal-panel {
        @apply scale-95;
    }
   
    .modal-close {
      @apply inline-flex h-8 w-8 items-center justify-center rounded-lg text-slate-400 transition-colors hover:bg-slate-100 hover:text-slate-700;
    }


    #notifContent{
        @apply relative;
    }
    .productNotif{
        @apply w-full absolute top-0 left-0 z-50 rounded-md bg-green-600 text-white px-4 py-2 text-sm font-medium shadow-md transition-opacity duration-300;
    }
    .productList{
        @apply grid gap-4;
        grid-template-columns: repeat(auto-fit, minmax(280px, 280px));

    }
    .no-results-message{
        @apply text-center text-slate-500 text-sm py-4;
        grid-area: 1 / 3 ;
    }
  }
</style>
</head>

<body class="min-h-screen bg-slate-50 font-sans text-slate-800 antialiased">

<!-- ===================== HEADER ===================== -->
<header class="sticky top-0 z-30 border-b border-slate-200 bg-slate-50/90 backdrop-blur">
  <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-3 sm:px-6">
    <div>
      <p class="font-mono text-[11px] uppercase tracking-widest text-amber-400">indexedDB · demo</p>
      <h1 class="font-display text-xl font-semibold text-slate-900 sm:text-2xl">Stockroom</h1>
    </div>

    <div class="hidden flex-1 max-w-md sm:block">
      <input type="search" placeholder="Rechercher un produit…" class="input searchInput">
    </div>

    <button class="btnAddProduct btn-primary">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="#ffffff" style="color: #fff;" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
      <span class="hidden sm:inline text-white font-semibold">Ajouter un produit</span>
    </button>
  </div>

  <div class="border-t border-slate-200 px-4 py-2 sm:hidden">
    <input type="search" placeholder="Rechercher un produit…" class="input searchInput">
  </div>
</header>

<div class="mx-auto flex max-w-7xl flex-col gap-6 px-4 py-6 sm:px-6 lg:flex-row">

  <!-- ===================== FILTRES (mobile) ===================== -->
  <!-- <details> natif = pas de JS nécessaire pour le repli -->
  <details class="lg:hidden">
    <summary class="mb-3 cursor-pointer list-none rounded-lg border border-slate-200 px-4 py-2.5 font-display text-sm font-semibold text-slate-700 marker:content-none">
      <span class="inline-flex w-full items-center justify-between">
        Filtres
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
      </span>
    </summary>

    <aside class="rounded-xl border border-slate-200 p-4">
      <div class="filter-group">
        <p class="label">Catégorie</p>
        <div class="category-filter">
          <!-- Les filtres de catégorie seront ajoutés dynamiquement ici -->
        </div>
      </div>

      <div class="filter-group">
        <p class="label">Prix (€)</p>
        <div class="flex items-center gap-2">
          <input type="number" min="0" placeholder="Min" class="minPrice input !py-1.5 text-sm">
          <span class="text-slate-400">-</span>
          <input type="number" min="0" placeholder="Max" class="maxPrice input !py-1.5 text-sm">
        </div>
      </div>

      <div class="filter-group">
        <p class="label">Disponibilité</p>
        <label class="checkbox-row">
          <input type="checkbox" class="h-4 w-4 rounded border-slate-300 bg-white text-amber-500 focus:ring-amber-500 focus:ring-offset-white">
          En stock uniquement
        </label>
      </div>

      <div class="mb-0 border-b-0 pb-0">
        <p class="label">Trier par</p>
        <select id="tri" name="tri" class="input text-sm">
          <option value="nom-asc">Nom (A → Z)</option>
          <option value="nom-desc">Nom (Z → A)</option>
          <option value="prix-asc">Prix croissant</option>
          <option value="prix-desc">Prix décroissant</option>
        </select>
      </div>
    </aside>
  </details>

  <!-- ===================== FILTRES (desktop, toujours visibles) ===================== -->
  <aside class="hidden w-64 shrink-0 lg:block">
    <div class="sticky top-20">
      <div class="mb-4 flex items-center justify-between">
        <h2 class="font-display text-base font-semibold text-slate-700">Filtres</h2>
        <button type="button" id="resetFilters" class="text-xs font-medium text-amber-400 hover:text-amber-300">Réinitialiser</button>
      </div>

      <div class="filter-group">
        <p class="label">Catégorie</p>
        <div class="category-filter">
          <!-- Les filtres de catégorie seront ajoutés dynamiquement ici -->
        </div>
      </div>

      <div class="filter-group">
        <p class="label">Prix (€)</p>
        <div class="flex items-center gap-2">
          <input type="number" min="0" placeholder="Min" class="minPrice input !py-1.5 text-sm">
          <span class="text-slate-400">-</span>
          <input type="number" min="0" placeholder="Max" class="maxPrice input !py-1.5 text-sm">
        </div>
      </div>

      <div class="filter-group">
        <p class="label">Disponibilité</p>
        <label class="checkbox-row">
          <input type="checkbox" class="h-4 w-4 rounded border-slate-300 bg-white text-amber-500 focus:ring-amber-500 focus:ring-offset-white">
          En stock uniquement
        </label>
      </div>

      <div class="mb-0 border-b-0 pb-0">
        <p class="label">Trier par</p>
        <select id="tri" name="tri" class="input text-sm">
          <option value="nom-asc">Nom (A → Z)</option>
          <option value="nom-desc">Nom (Z → A)</option>
          <option value="prix-asc">Prix croissant</option>
          <option value="prix-desc">Prix décroissant</option>
        </select>
      </div>

    </div>
  </aside>

  <!-- ===================== LISTE DE PRODUITS ===================== -->
  <main class="min-w-0 flex-1">
    <p class="mb-4 text-sm text-slate-500" id="product-count"></p>

    <div class="productList" id="productList">
      <!-- LISTE DES PRODUITS INSEREE AUTOMATIQUEMENT -->

    </div>
  </main>
</div>

<!-- ===================== MODALE AJOUT PRODUIT ===================== -->
<!--
  Ouverture/fermeture en CSS pur, via :target : le bouton "Ajouter un
  produit" est un lien vers #product-modal, la croix est un lien vers #
  qui vide le hash. Pas une ligne de JS.
-->
<div id="product-modal" class="modal showModal">
  <div class="modal-panel">
    
  </div>
</div>
<div class=""></div>
<script type="module" src="app.js"></script>
</body>
</html>
